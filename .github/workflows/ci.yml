name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate hand-maintained data files
        run: python main.py validate

      - name: Run tests
        run: python -m unittest -v tests.test_threat_intel

      - name: Build a sample bulletin from the bundled data (public edition)
        if: matrix.python-version == '3.12'
        run: python main.py bulletin --days 60 --public --outdir sample-output

      - name: Upload the sample bulletin
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sample-bulletin
          path: sample-output/
          retention-days: 14
